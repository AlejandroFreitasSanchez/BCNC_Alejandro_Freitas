# Activa el perfil de pruebas
spring.profiles.active=test

# Configuración de la base de datos H2 en memoria
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=BCNC
spring.datasource.password=BCNC
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.schema-locations=classpath:BBDD/scripts/h2-db-app-h2db-schema.sql
spring.sql.init.data-locations=classpath:BBDD/scripts/h2-db-app-h2db-data.sql
spring.sql.init.mode=always
server.error.include-stacktrace=never